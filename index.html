<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14110d;
    --bg-raised: #1c1811;
    --slot: #211c14;
    --slot-border: #3a2f1e;
    --bronze: #8a6a3a;
    --gold: #c9a24b;
    --gold-bright: #e8c976;
    --parchment: #e8dfc8;
    --muted: #8a8272;
    --green: #3fae5c;
    --green-glow: rgba(63,174,92,0.45);
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 20% -10%, #241d12 0%, transparent 55%),
      radial-gradient(ellipse at 90% 10%, #1a1710 0%, transparent 50%),
      var(--bg);
    color: var(--parchment);
    font-family: 'Spectral', serif;
    min-height: 100vh;
    padding: 28px 16px 60px;
  }
  .wrap{ max-width: 900px; margin: 0 auto; }

  header{ text-align:center; margin-bottom: 22px; }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.25em;
    color: var(--bronze);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  h1{
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size: clamp(26px, 5vw, 38px);
    margin: 0 0 6px;
    color: var(--gold-bright);
    text-shadow: 0 0 18px rgba(201,162,75,0.25);
    letter-spacing: 0.02em;
  }
  .sub{ color: var(--muted); font-size: 14px; font-style: italic; }

  .progress-card{
    background: linear-gradient(180deg, var(--bg-raised), #17130d);
    border: 1px solid var(--slot-border);
    border-radius: 8px;
    padding: 16px 18px;
    margin: 22px 0 30px;
  }
  .progress-top{
    display:flex; justify-content: space-between; align-items:baseline;
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .progress-top strong{
    color: var(--gold-bright);
    font-size: 16px;
  }
  .bar-track{
    height: 10px;
    background: #0e0c08;
    border: 1px solid var(--slot-border);
    border-radius: 5px;
    overflow: hidden;
  }
  .bar-fill{
    height: 100%;
    background: linear-gradient(90deg, #2f8a48, var(--green));
    box-shadow: 0 0 10px var(--green-glow);
    width: 0%;
    transition: width .4s ease;
  }
  .bar-fill.gold{
    background: linear-gradient(90deg, #8a6a2f, var(--gold));
    box-shadow: 0 0 10px rgba(201,162,75,0.45);
  }

  .category{ margin-bottom: 30px; }
  .cat-header{
    display:flex; align-items:center; gap: 10px;
    margin-bottom: 12px;
  }
  .cat-header h2{
    font-family:'Cinzel', serif;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0;
    white-space: nowrap;
  }
  .cat-header .rule{
    flex:1; height:1px;
    background: linear-gradient(90deg, var(--slot-border), transparent);
  }
  .cat-count{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: 10px;
  }

  .slot{
    position: relative;
    min-height: 108px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.02), transparent 40%),
      var(--slot);
    border: 1px solid var(--slot-border);
    border-radius: 6px;
    cursor: pointer;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    padding: 6px 4px;
    text-align:center;
    transition: border-color .15s ease, box-shadow .15s ease, transform .1s ease;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .slot:hover{
    border-color: var(--bronze);
    box-shadow: 0 0 12px rgba(138,106,58,0.25);
  }
  .slot:active{ transform: scale(0.96); }

  .icon{
    font-size: 26px;
    line-height:1;
    margin-bottom: 6px;
    filter: grayscale(0.15) drop-shadow(0 2px 3px rgba(0,0,0,0.5));
  }
  .item-name{
    font-size: 10.5px;
    color: var(--parchment);
    line-height: 1.2;
    font-weight: 500;
  }
  .item-price{
    font-family:'JetBrains Mono', monospace;
    font-size: 9.5px;
    color: var(--bronze);
    margin-top: 3px;
    letter-spacing: 0.02em;
  }
  .slot.done .item-price{ color: #7fcf95; }
  .item-price.untradeable{
    font-style: italic;
    opacity: 0.75;
  }

  .slot.done{
    border-color: var(--green);
    background:
      radial-gradient(ellipse at 50% 30%, rgba(63,174,92,0.18), transparent 70%),
      var(--slot);
    box-shadow: 0 0 14px var(--green-glow), inset 0 0 0 1px rgba(63,174,92,0.35);
  }
  .slot.done .item-name{ color: var(--gold-bright); }
  .slot.done .icon{ filter: none; }

  .seal{
    position:absolute;
    top: -7px; right: -7px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #58d97a, var(--green) 70%);
    border: 1px solid #2a6e3c;
    display:flex; align-items:center; justify-content:center;
    font-size: 12px;
    color: #0e1a10;
    font-weight: 700;
    opacity: 0;
    transform: scale(0.5);
    transition: opacity .18s ease, transform .18s ease;
    box-shadow: 0 0 8px rgba(63,174,92,0.6);
  }
  .slot.done .seal{ opacity: 1; transform: scale(1); }

  footer{
    text-align:center;
    margin-top: 34px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
  footer button{
    background: none;
    border: 1px solid var(--slot-border);
    color: var(--muted);
    font-family: inherit;
    font-size: 11px;
    padding: 7px 14px;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 10px;
  }
  footer button:hover{ border-color: var(--bronze); color: var(--gold); }

  .price-status{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 18px;
    padding: 0 2px;
  }
  .price-status button{
    background: none;
    border: 1px solid var(--slot-border);
    color: var(--muted);
    font-family: inherit;
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .price-status button:hover{ border-color: var(--bronze); color: var(--gold); }
  .price-status button:disabled{ opacity: 0.5; cursor: default; }

  @media (prefers-reduced-motion: reduce){
    .slot, .bar-fill, .seal{ transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Collection Log</div>
    <h1>End-Game Gear Tracker</h1>
    <div class="sub">Tap a slot to mark it collected</div>
  </header>

  <div class="progress-card">
    <div class="progress-top">
      <span>Total progress</span>
      <strong id="progress-label">0 / 0</strong>
    </div>
    <div class="bar-track"><div class="bar-fill" id="bar-fill"></div></div>

    <div class="progress-top" style="margin-top:16px;">
      <span>Value progress</span>
      <strong id="value-percent-label">0%</strong>
    </div>
    <div class="bar-track"><div class="bar-fill gold" id="value-bar-fill"></div></div>
    <div class="progress-top" style="margin-top:6px; margin-bottom:0; font-size:11px;">
      <span id="value-label">0 gp collected</span>
      <span id="value-total-label">of 0 gp</span>
    </div>
  </div>

  <div class="price-status" id="price-status">
    <span id="price-status-text">Loading live prices…</span>
    <button id="refresh-btn" type="button">Refresh prices</button>
  </div>

  <div id="categories"></div>

  <footer>
    Progress saves automatically on this device.
    <br>
    <button id="reset-btn">Reset all</button>
  </footer>
</div>

<script>
// Prices are approximate GE values pulled from the OSRS Wiki / live price
// trackers and will drift over time. `price: null` means the finished item
// is not tradeable on the Grand Exchange (usually because it's charged with
// an untradeable component).
const DATA = [
  { cat: "Melee Weapons", icon: "⚔️", items: [
    { name: "Emberlight", price: 32000000, note: "priced as tormented synapse, its untradeable ingredient", components: ["Tormented synapse"] },
    { name: "Noxious Halberd", price: 41000000 },
    { name: "Dragon Claws", price: 40500000 },
    { name: "Bandos Godsword", price: 18500000 },
    { name: "Saradomin Godsword", price: 23100000 },
    { name: "Granite Hammer", price: 10400000 },
    { name: "Scythe of Vitur", price: 1400000000, note: "uncharged price" },
    { name: "Dragonhunter Lance", price: 56800000, wikiName: "Dragon hunter lance" },
    { name: "Soulreaper Axe", price: 420000000 },
  ]},
  { cat: "Ranged Weapons", icon: "🏹", items: [
    { name: "Zaryte Crossbow", price: 350000000 },
    { name: "Dragonhunter Crossbow", price: 36000000, wikiName: "Dragon hunter crossbow" },
    { name: "Twisted Bow", price: 1305000000 },
    { name: "Venator Bow", price: 67600000, note: "uncharged price", wikiName: "Venator bow (uncharged)" },
  ]},
  { cat: "Magic Weapons", icon: "🔮", items: [
    { name: "Purging Staff", price: 32000000, note: "priced as tormented synapse, its untradeable ingredient", components: ["Tormented synapse"] },
    { name: "Tumeken's Shadow", price: 782000000, note: "uncharged price", wikiName: "Tumeken's shadow (uncharged)" },
    { name: "Twinflame Staff", price: 9200000 },
    { name: "Dragonhunter Wand", price: 14800000, wikiName: "Dragon hunter wand" },
  ]},
  { cat: "Shields & Off-hands", icon: "🛡️", items: [
    { name: "Dragonfire Shield", price: 3470000 },
    { name: "Dragonfire Ward", price: 11300000 },
    { name: "Twisted Buckler", price: 15400000 },
    { name: "Ward of Elidnis", price: 3800000, wikiName: "Elidinis' ward" },
    { name: "Eye of Ayak", price: 55000000, note: "uncharged price", wikiName: "Eye of ayak (uncharged)" },
  ]},
  { cat: "Ancestral Set", icon: "🧙", items: [
    { name: "Ancestral Hat", price: 18000000 },
    { name: "Ancestral Robe Top", price: 91000000 },
    { name: "Ancestral Robe Bottom", price: 61700000 },
  ]},
  { cat: "Oathplate Set", icon: "🩸", items: [
    { name: "Oathplate Helm", price: 85000000 },
    { name: "Oathplate Chest", price: 88600000 },
    { name: "Oathplate Legs", price: 92100000 },
  ]},
  { cat: "Other Armor", icon: "🦺", items: [
    { name: "Zaryte Vambraces", price: 70000000 },
    { name: "Confliction Gauntlets", price: 68000000 },
    { name: "Pegasian Boots", price: 33600000 },
    { name: "Primordial Boots", price: 19000000 },
    { name: "Eternal Boots", price: 4160000 },
    { name: "Avernic Treads", price: 156700000, note: "base, pre-upgrade" },
  ]},
  { cat: "Masori Armour (f)", icon: "🎩", items: [
    { name: "Masori Mask (f)", price: 21000000 },
    { name: "Masori Body (f)", price: 85000000 },
    { name: "Masori Chaps (f)", price: 55000000 },
  ]},
  { cat: "Rings", icon: "💍", items: [
    { name: "Venator Ring", price: 45000000 },
    { name: "Ultor Ring", price: 115000000 },
    { name: "Magus Ring", price: 28000000 },
  ]},
  { cat: "Amulets", icon: "📿", items: [
    { name: "Necklace of Rupture", price: 150000000 },
    { name: "Amulet of Rancour", price: 54000000 },
    { name: "Amulet of Blood Fury", price: 10300000, note: "approx: amulet of fury + blood shard", components: ["Amulet of fury", "Blood shard"] },
  ]},
];

function formatGp(n){
  if (n === null || n === undefined) return "Not tradeable";
  if (n >= 1000000000) return (n / 1000000000).toFixed(2).replace(/\.00$/, "") + "B gp";
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M gp";
  if (n >= 1000) return (n / 1000).toFixed(0) + "K gp";
  return n + " gp";
}

const STORAGE_KEY = "osrs-collection-log-state";
let state = {};

function slugify(catIdx, name){
  return "item_" + catIdx + "_" + name.toLowerCase().replace(/[^a-z0-9]+/g, "-");
}

function totalItemCount(){
  return DATA.reduce((sum, c) => sum + c.items.length, 0);
}

function render(){
  const container = document.getElementById("categories");
  container.innerHTML = "";

  DATA.forEach((cat, ci) => {
    const section = document.createElement("div");
    section.className = "category";

    const doneInCat = cat.items.filter(it => state[slugify(ci, it.name)]).length;

    section.innerHTML = `
      <div class="cat-header">
        <h2>${cat.icon} ${cat.cat}</h2>
        <div class="rule"></div>
        <div class="cat-count">${doneInCat}/${cat.items.length}</div>
      </div>
      <div class="grid"></div>
    `;

    const grid = section.querySelector(".grid");
    cat.items.forEach(item => {
      const key = slugify(ci, item.name);
      const isDone = !!state[key];
      const slot = document.createElement("div");
      slot.className = "slot" + (isDone ? " done" : "");
      slot.dataset.key = key;
      const priceClass = item.price === null ? "item-price untradeable" : "item-price";
      slot.innerHTML = `
        <div class="seal">✓</div>
        <div class="icon">${cat.icon}</div>
        <div class="item-name">${item.name}</div>
        <div class="${priceClass}">${formatGp(item.price)}</div>
      `;
      slot.title = item.note ? item.note : "";
      slot.addEventListener("click", () => toggle(key));
      grid.appendChild(slot);
    });

    container.appendChild(section);
  });

  updateProgress();
}

function updateProgress(){
  const total = totalItemCount();
  const done = Object.values(state).filter(Boolean).length;
  document.getElementById("progress-label").textContent = `${done} / ${total}`;
  document.getElementById("bar-fill").style.width = total ? `${(done/total)*100}%` : "0%";

  let value = 0;
  let totalValue = 0;
  DATA.forEach((cat, ci) => {
    cat.items.forEach(item => {
      if (item.price) {
        totalValue += item.price;
        if (state[slugify(ci, item.name)]) value += item.price;
      }
    });
  });

  const pct = totalValue ? (value / totalValue) * 100 : 0;
  document.getElementById("value-percent-label").textContent = `${pct.toFixed(1)}%`;
  document.getElementById("value-bar-fill").style.width = `${pct}%`;
  document.getElementById("value-label").textContent = `${formatGp(value)} collected`;
  document.getElementById("value-total-label").textContent = `of ${formatGp(totalValue)}`;
}

async function toggle(key){
  state[key] = !state[key];
  render();
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
  } catch (e) {
    console.error("Failed to save progress:", e);
  }
}

async function loadState(){
  try {
    const result = await window.storage.get(STORAGE_KEY, false);
    if (result && result.value) {
      state = JSON.parse(result.value);
    }
  } catch (e) {
    state = {};
  }
  render();
}

// --- Live price fetching -------------------------------------------------
// Pulls current Grand Exchange prices from the OSRS Wiki's public price API
// (https://prices.runescape.wiki/api/v1/osrs/) and overwrites the reference
// prices baked into DATA above. This requires outbound network access,
// which is NOT available inside Claude's artifact sandbox — it will fail
// silently there and just fall back to the saved reference prices. Host
// this file yourself (see the export/hosting instructions) for it to work.
const WIKI_LATEST_URL = "https://prices.runescape.wiki/api/v1/osrs/latest";
const WIKI_MAPPING_URL = "https://prices.runescape.wiki/api/v1/osrs/mapping";
const PRICE_CACHE_KEY = "osrs-collection-log-price-cache";

function priceStatusEl(){ return document.getElementById("price-status-text"); }

async function fetchLivePrices(){
  const btn = document.getElementById("refresh-btn");
  if (btn) btn.disabled = true;
  if (priceStatusEl()) priceStatusEl().textContent = "Fetching live prices…";

  try {
    const [mappingRes, latestRes] = await Promise.all([
      fetch(WIKI_MAPPING_URL),
      fetch(WIKI_LATEST_URL),
    ]);
    if (!mappingRes.ok || !latestRes.ok) throw new Error("Wiki API request failed");

    const mapping = await mappingRes.json();
    const latest = (await latestRes.json()).data;

    const nameToId = {};
    mapping.forEach(m => { nameToId[m.name.toLowerCase()] = m.id; });

    function priceForWikiName(name){
      const id = nameToId[name.toLowerCase()];
      if (id === undefined) return null;
      const entry = latest[id];
      if (!entry) return null;
      return entry.high ?? entry.low ?? null;
    }

    let matched = 0, missed = 0;

    DATA.forEach(cat => {
      cat.items.forEach(item => {
        if (item.components) {
          let sum = 0, ok = true;
          item.components.forEach(cName => {
            const p = priceForWikiName(cName);
            if (p === null) ok = false; else sum += p;
          });
          if (ok) { item.price = sum; matched++; } else { missed++; }
        } else {
          const lookupName = item.wikiName || item.name;
          const p = priceForWikiName(lookupName);
          if (p !== null) { item.price = p; matched++; } else { missed++; }
        }
      });
    });

    const now = new Date();
    if (priceStatusEl()) {
      priceStatusEl().textContent =
        `Live prices updated ${now.toLocaleTimeString()} (${matched} matched` +
        (missed ? `, ${missed} unmatched)` : ")");
    }

    try {
      await window.storage.set(PRICE_CACHE_KEY, JSON.stringify({
        prices: DATA.flatMap((cat, ci) => cat.items.map((item, ii) => [`${ci}_${ii}`, item.price])),
        fetchedAt: now.toISOString(),
      }), false);
    } catch (e) { /* non-fatal */ }

    render();
  } catch (err) {
    console.warn("Live price fetch failed (expected inside the artifact sandbox):", err);
    if (priceStatusEl()) {
      priceStatusEl().textContent = "Live prices unavailable here — showing saved reference prices";
    }
  } finally {
    if (btn) btn.disabled = false;
  }
}

document.getElementById("refresh-btn").addEventListener("click", fetchLivePrices);


document.getElementById("reset-btn").addEventListener("click", async () => {
  if (!confirm("Reset all collected items?")) return;
  state = {};
  render();
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
  } catch (e) {
    console.error("Failed to reset progress:", e);
  }
});

loadState();
fetchLivePrices();
</script>
</body>
</html>
